<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script src="sdpi-components.js"></script>
		<style>
			.help {
				margin: 4px 0 0 0;
				padding: 0;
				font-size: 12px;
				line-height: 1.5;
				opacity: 0.75;
			}
		</style>
	</head>
	<body>
		<sdpi-item label="Sound">
			<sdpi-checkbox setting="alertSound" global default="true" label="Play a sound when a session needs you"></sdpi-checkbox>
		</sdpi-item>

		<sdpi-item label="Notification">
			<sdpi-checkbox setting="alertToast" global default="true" label="Show a Windows notification"></sdpi-checkbox>
		</sdpi-item>

		<sdpi-item label="Finished">
			<sdpi-checkbox setting="alertOnDone" global label="Also alert when a turn finishes"></sdpi-checkbox>
		</sdpi-item>

		<sdpi-item label="Escalate">
			<sdpi-select setting="escalateMinutes" global default="3">
				<option value="0">Never</option>
				<option value="1">After 1 minute</option>
				<option value="2">After 2 minutes</option>
				<option value="3">After 3 minutes</option>
				<option value="5">After 5 minutes</option>
				<option value="10">After 10 minutes</option>
			</sdpi-select>
		</sdpi-item>

		<sdpi-item label="Setup">
			<p id="setup-status" class="help">Checking...</p>
		</sdpi-item>

		<sdpi-item>
			<sdpi-button id="setup-install">Install hooks and status line</sdpi-button>
		</sdpi-item>

		<sdpi-item>
			<sdpi-button id="setup-remove">Remove</sdpi-button>
		</sdpi-item>

		<sdpi-item label="Info">
			<p class="help">
				The character walks while Claude works and shows the turn timer. When a session needs you it hops. If it keeps
				waiting past the escalation time, the alert turns red and sounds again every interval. These settings apply to all
				Claude Status keys.
			</p>
		</sdpi-item>
		<script>
			const { streamDeckClient } = SDPIComponents;
			const statusText = document.getElementById("setup-status");

			function describe(result) {
				if (!result.ok) {
					return "Could not check or change the Claude settings: " + result.message;
				}
				const hooks = result.status.hooks ? "installed" : "not installed";
				const statusLine = { forwarder: "installed", other: "another status line is in use", none: "not installed" }[result.status.statusLine];
				return "Hooks: " + hooks + ". Status line: " + statusLine + "." + (result.message ? " " + result.message : "");
			}

			streamDeckClient.sendToPropertyInspector.subscribe((message) => {
				const payload = message && message.payload ? message.payload : message;
				if (payload && payload.event === "setup-result") {
					statusText.textContent = describe(payload);
				}
			});

			const ask = (event) => streamDeckClient.send("sendToPlugin", { event });
			document.getElementById("setup-install").addEventListener("click", () => ask("setup-install"));
			document.getElementById("setup-remove").addEventListener("click", () => ask("setup-remove"));
			ask("setup-check");
		</script>
	</body>
</html>
