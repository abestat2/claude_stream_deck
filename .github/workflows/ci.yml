name: CI

# Runs on every branch other than the main branch and on pull requests into it. Each run builds a package
# whose version is the latest release with the patch number raised by the number of commits the branch has
# beyond the main branch (0.2.0 becomes 0.2.1, then 0.2.2). Changes that reach the main branch are tested
# and released by the Release workflow.

on:
  push:
    branches-ignore: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

# A push and a pull request for the same branch share one group, so only one of them keeps running.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, test, and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Choose the branch version
        id: version
        shell: bash
        run: |
          base="origin/${{ github.event.repository.default_branch }}"
          commits="$(git rev-list --count --no-merges "$base..HEAD")"
          version="$(git tag --list 'v*' | node scripts/next-version.mjs --branch "$commits")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version ($commits commits beyond the main branch)"

      - name: Apply the version
        run: node scripts/set-version.mjs "${{ steps.version.outputs.version }}"

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build, validate, and package
        run: npm run package

      - name: Upload the plugin package
        uses: actions/upload-artifact@v4
        with:
          name: claude-deck-${{ steps.version.outputs.version }}
          path: dist/*.streamDeckPlugin
          if-no-files-found: error
