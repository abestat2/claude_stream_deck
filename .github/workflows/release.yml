name: Release

# Every change that reaches the main branch is released. The version is the minor number of the latest
# release plus one (0.1.0 is followed by 0.2.0), chosen from the release tags by scripts/next-version.mjs.

on:
  push:
    branches: [master, main]

permissions:
  contents: write

# Releases run one at a time so two merges in quick succession get different versions.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Test and publish the release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Choose the version
        id: version
        shell: bash
        run: |
          version="$(git tag --list 'v*' | node scripts/next-version.mjs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Apply the version
        run: node scripts/set-version.mjs "${{ steps.version.outputs.version }}"

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build, validate, and package
        run: npm run package

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" dist/*.streamDeckPlugin \
            --target "$GITHUB_SHA" \
            --title "Claude Deck v${{ steps.version.outputs.version }}" \
            --generate-notes
